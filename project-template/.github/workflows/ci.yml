# Runs scripts/check-all.sh, the same checks a contributor runs before
# sending a change, on every pull request and on main. Add the setup of
# the project's language (toolchain, dependencies) where the comment says.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # --- The setup of the project's language goes here.
      - name: Install reuse
        run: pipx install reuse
      - name: Run every check
        run: scripts/check-all.sh
