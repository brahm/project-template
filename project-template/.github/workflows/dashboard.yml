# Regenerates the progress dashboard from main and publishes it with
# GitHub Pages. To use it, set Settings > Pages > Source to "GitHub
# Actions". docs/dashboard/README.md says what the page reads.
name: Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the page lists merges when GitHub does not answer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the page
        env:
          GH_TOKEN: ${{ github.token }}    # lets the script list the pull requests
        run: |
          mkdir -p _site
          python3 scripts/dashboard.py --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
