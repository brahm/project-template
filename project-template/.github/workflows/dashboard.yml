# Publishes the progress dashboard with GitHub Pages whenever its sources
# change on main. Turn Pages on in the repository settings (source: GitHub
# Actions) first, or delete this file if the project does not want it.
name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - docs/inventory/**
      - docs/roadmap.md
      - docs/backlog/**
      - docs/dashboard/**
      - scripts/dashboard.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the page
        run: python3 scripts/dashboard.py --out _site/dashboard/index.html
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dashboard/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
